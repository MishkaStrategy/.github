name: HQ policy final sync

on:
  push:
    branches:
      - policy/zero-model-codex-routing

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: policy/zero-model-codex-routing
          fetch-depth: 0

      - name: Apply exact final architecture policy replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("HQ_MASTER_PROMPT.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "Если exact resource отсутствует/недоступен — `BLOCKED`, zero model invocation.\n\nUnsupported control operation — `BLOCKED`, never Codex.",
                  "Если exact resource отсутствует/недоступен — `BLOCKED`, zero model invocation.\n\nЕсли repository присутствует в allowlist, но exact execution token детерминированно не может прочитать repository/resource (`404/403`/access denied), это `BLOCKED / MISSING_EXACT_PREREQUISITE`, zero model invocation. Allowlist policy не является доказательством runtime access.\n\nUnsupported control operation — `BLOCKED`, never Codex."
              ),
              (
                  "Codex не является GitHub-control executor и не является заменой обычному worker только потому, что он доступен.\n\nНе отправляй одну и ту же задачу одновременно Worker и Codex.",
                  "Codex не является GitHub-control executor и не является заменой обычному worker только потому, что он доступен.\n\nНе отправляй одну и ту же задачу одновременно Worker и Codex.\n\n### IMMEDIATE PRE-MODEL ZERO-MODEL RECHECK\n\nPersisted `queued → running` claim сам по себе не даёт права на model invocation. После exact path/id/repo/digest claim verification и **непосредственно перед `codex exec`** deterministic pre-model gate обязан повторно проверить exact running packet и live prerequisites.\n\nМинимум повторно проверяются: `kind: code`, allowlist + runtime repository access, `routing.selected_route: CODEX`, `routing.decided_by: HQ`, structured last-resort placement, trivial-work rejection и exact source/ref/PR/base freshness.\n\nЕсли между coordinator preflight и model entry source стал stale, prerequisite исчез/стал недоступен, route/placement перестал быть валиден, allowlist/access потерян или running claim оказался не-code — exact task проходит `running → blocked` с `codex_model_invocation: false`; replacement work не выбирается и model fallback запрещён.\n\nТолько deterministic `should_invoke=true` разрешает следующий hard `kind: code` guard и model step. `CODEX_MODEL_INVOCATION=true` фиксируется только внутри model step непосредственно перед `codex exec`. После pre-model gate Codex всё равно обязан fail-closed revalidate hard guards перед target mutation, потому что external state нельзя заморозить."
              ),
              (
                  "queued task\n    -> zero-model routing + preflight\n    -> zero-model DONE/BLOCKED/BLOCKED_STALE/CONTROL, если применимо\n    -> только legitimate last-resort kind: code может попасть в Codex claim/model path",
                  "queued task\n    -> zero-model routing + preflight\n    -> zero-model DONE/BLOCKED/BLOCKED_STALE/CONTROL, если применимо\n    -> только legitimate last-resort kind: code может получить persisted claim\n    -> exact persisted claim path/id/repo/digest verification\n    -> immediate zero-model live recheck exact running claim\n    -> stale/missing/inaccessible/invalid/non-code => running → blocked, zero model\n    -> только still-valid legitimate kind: code может попасть в Codex model path"
              ),
              (
                  "Если `github_control`: `ZERO CODEX MODEL INVOCATIONS`.\n\nПосле enqueue legitimate Codex code task",
                  "Если `github_control`: `ZERO CODEX MODEL INVOCATIONS`.\n\nЕсли после persisted claim immediate pre-model recheck обнаружил stale/missing/inaccessible/invalid/non-code state: `ZERO CODEX MODEL INVOCATIONS`.\n\nПосле enqueue legitimate Codex code task"
              ),
              (
                  "7. **Zero-model preflight обязан предотвращать очевидно ненужные model calls**: invalid placement, stale source, missing exact prerequisite, already-achieved desired state, not-allowlisted target.\n8. **At most one bounded result per Codex invocation**:",
                  "7. **Zero-model preflight обязан предотвращать очевидно ненужные model calls**: invalid placement, stale source, missing exact prerequisite, already-achieved desired state, not-allowlisted target и allowlisted-but-runtime-inaccessible target.\n8. **Persisted claim не отменяет credit gate**: immediate zero-model live recheck exact running claim обязателен непосредственно перед model entry; stale/missing/inaccessible/invalid/non-code state блокируется с `codex_model_invocation:false`.\n9. **At most one bounded result per Codex invocation**:"
              ),
              (
                  "Если HQ после live-проверки определил, что PR должен стать Ready, он сам выполняет `Ready for review`; если HQ connector не может, использует exact `CONTROL_ZERO_MODEL/pr_mark_ready` с immutable preconditions. Codex model для этого запрещён. Не проси пользователя нажимать кнопку.",
                  "Если HQ после live-проверки определил, что PR должен стать Ready, он сам выполняет `Ready for review`; если HQ connector не может, использует exact `CONTROL_ZERO_MODEL/pr_mark_ready` с immutable preconditions. Codex model для этого запрещён. Не проси пользователя нажимать кнопку.\n\nЕсли GitHub прямо запрещает Ready mutation доступным integration credentials, это не human-only decision. HQ может использовать semantically equivalent zero-model lifecycle workaround: live-зафиксировать exact Draft PR head/base, закрыть Draft **без merge**, создать non-draft replacement PR из того же exact head branch на тот же base, повторно проверить exact diff/CI/reviews/mergeability и продолжить lifecycle. Нельзя использовать этот workaround при head/base drift, semantic diff change или policy, требующей именно существующий PR identity."
              ),
              (
                  "В частности, нельзя просить пользователя вручную делать `Ready for review`, close/reopen, branch delete или другую безопасно поддерживаемую bounded GitHub-control operation только потому, что HQ connector сломан. Используй соответствующий deterministic zero-model path.",
                  "В частности, нельзя просить пользователя вручную делать `Ready for review`, close/reopen, branch delete или другую безопасно поддерживаемую bounded GitHub-control operation только потому, что HQ connector сломан. Используй соответствующий deterministic zero-model path; если Ready mutation недоступна integration credentials, проверь safe same-head/same-base non-draft replacement PR workaround из §17 до human escalation."
              ),
              (
                  "    └── LEGITIMATE LAST-RESORT kind: code\n            ↓\n          CODEX\n            ↓\n      AT MOST ONE MODEL INVOCATION",
                  "    └── LEGITIMATE LAST-RESORT kind: code\n            ↓\n      PERSIST EXACT CLAIM\n            ↓\n      IMMEDIATE ZERO-MODEL LIVE RECHECK\n        ├── STALE/MISSING/INACCESSIBLE/INVALID/NON-CODE → BLOCKED, ZERO MODEL\n        └── STILL VALID kind: code\n            ↓\n          CODEX\n            ↓\n      AT MOST ONE MODEL INVOCATION"
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new)

          required = [
              "github_control MUST NEVER reach codex exec",
              "IMMEDIATE PRE-MODEL ZERO-MODEL RECHECK",
              "allowlisted-but-runtime-inaccessible",
              "non-draft replacement PR",
              "CODEX_MODEL_INVOCATION=true",
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f"missing required policy token: {token}")

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/hq-policy-final-sync.yml").unlink()

      - name: Verify exact one-file final diff and commit
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git status --short | awk '{print $2}')"
          printf '%s\n' "$changed"
          test "$changed" = "HQ_MASTER_PROMPT.md"
          git config user.name "Mishka HQ Zero-Model Policy Sync"
          git config user.email "hq-zero-model-policy@users.noreply.github.com"
          git add -A
          git commit -m "Finalize HQ zero-model pre-model policy"
          git push origin HEAD:policy/zero-model-codex-routing
