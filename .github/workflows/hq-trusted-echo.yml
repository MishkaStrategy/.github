name: HQ Trusted ECHO Gate

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hq-trusted-echo-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  trusted-gate:
    name: HQ Trusted ECHO Gate
    if: ${{ github.repository == 'MishkaStrategy/ECHO' }}
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - name: Validate organization HQ policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import fnmatch
          import json
          import os
          import re
          import urllib.request

          EVENT_PATH = os.environ["GITHUB_EVENT_PATH"]
          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          API_URL = os.environ["GH_API_URL"].rstrip("/")
          TOKEN = os.environ["GH_TOKEN"]
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")
          LEGACY_CUTOFF = dt.datetime.fromisoformat("2026-08-22T17:57:04+00:00")

          if REPOSITORY != "MishkaStrategy/ECHO":
              raise SystemExit(f"trusted ECHO gate invoked for unexpected repository: {REPOSITORY}")

          with open(EVENT_PATH, "r", encoding="utf-8") as handle:
              event = json.load(handle)

          pr = event.get("pull_request")
          if not isinstance(pr, dict):
              raise SystemExit("trusted ECHO gate requires a pull_request event")
          if pr["base"]["ref"] != "main":
              raise SystemExit("trusted ECHO gate only authorizes pull requests targeting main")

          body = pr.get("body") or ""
          state_blocks = re.findall(r"<!-- HQ_STATE\n(.*?)\n-->", body, re.DOTALL)

          created_at = dt.datetime.fromisoformat(pr["created_at"].replace("Z", "+00:00"))
          if not state_blocks and created_at < LEGACY_CUTOFF:
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as handle:
                      handle.write("## HQ trusted gate\n\n")
                      handle.write("- Result: `PASS (legacy grandfathered PR)`\n")
                      handle.write(f"- PR: `#{pr['number']}`\n")
                      handle.write(f"- Head: `{pr['head']['sha']}`\n")
              raise SystemExit(0)

          if len(state_blocks) != 1:
              raise SystemExit("new ECHO pull requests require exactly one HQ_STATE block")

          state: dict[str, str] = {}
          for raw_line in state_blocks[0].splitlines():
              line = raw_line.strip()
              if not line:
                  continue
              if "=" not in line:
                  raise SystemExit(f"invalid HQ_STATE line: {raw_line!r}")
              key, value = line.split("=", 1)
              key = key.strip()
              if key in state:
                  raise SystemExit(f"duplicate HQ_STATE key: {key}")
              state[key] = value.strip()

          required = {
              "issue",
              "base",
              "candidate",
              "phase",
              "implementation_repairs",
              "ci_reruns",
              "review_repairs",
              "human_approval_required",
          }
          missing = sorted(required - state.keys())
          if missing:
              raise SystemExit(f"missing HQ_STATE keys: {', '.join(missing)}")

          if not state["issue"].isdigit():
              raise SystemExit("HQ_STATE issue must be numeric")
          for key in ("base", "candidate"):
              if re.fullmatch(r"[0-9a-f]{40}", state[key]) is None:
                  raise SystemExit(f"HQ_STATE {key} must be a full 40-character SHA")

          head_sha = pr["head"]["sha"]
          if state["candidate"] != head_sha:
              raise SystemExit(
                  f"HQ_STATE candidate {state['candidate']} does not match current PR head {head_sha}"
              )

          allowed_phases = {
              "ANALYZED",
              "BRANCH_CREATED",
              "IMPLEMENTING",
              "FOCUSED_TESTS",
              "DRAFT_PR",
              "CI_RUNNING",
              "CI_GREEN",
              "REVIEW",
              "READY_TO_MERGE",
              "BLOCKED",
              "MERGED",
              "VERIFIED",
              "DONE",
          }
          if state["phase"] not in allowed_phases:
              raise SystemExit(f"unsupported HQ_STATE phase: {state['phase']}")

          limits = {
              "implementation_repairs": 5,
              "ci_reruns": 2,
              "review_repairs": 3,
          }
          for key, limit in limits.items():
              if not state[key].isdigit():
                  raise SystemExit(f"HQ_STATE {key} must be numeric")
              if int(state[key]) > limit:
                  raise SystemExit(f"HQ_STATE {key} exceeded circuit breaker ({limit})")

          approval = state["human_approval_required"].lower()
          if approval not in {"true", "false"}:
              raise SystemExit("human_approval_required must be true or false")

          protected_patterns = (
              ".github/workflows/**",
              ".github/actions/**",
              ".hq/**",
              "docs/architecture/RELEASE_GATES.md",
              "requirements*.txt",
              "pyproject.toml",
              "integrations/**",
              "modules/*/adapter.py",
              "modules/*/manifest.json",
              "release/**",
              "deploy/**",
              "auth/**",
              "secrets/**",
          )

          def api_get(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "MishkaStrategy-HQ-Trusted-Gate",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          changed: list[str] = []
          page = 1
          while True:
              items = api_get(
                  f"{API_URL}/repos/{REPOSITORY}/pulls/{pr['number']}/files?per_page=100&page={page}"
              )
              if not isinstance(items, list):
                  raise SystemExit("unexpected GitHub files response")
              changed.extend(str(item["filename"]) for item in items)
              if len(items) < 100:
                  break
              page += 1
              if page > 100:
                  raise SystemExit("pull request file pagination exceeded safety bound")

          high_risk_files = sorted(
              path
              for path in changed
              if any(fnmatch.fnmatch(path, pattern) for pattern in protected_patterns)
          )
          high_risk = bool(high_risk_files)
          if high_risk and approval != "true":
              raise SystemExit(
                  "high-risk paths changed but HQ_STATE does not require human approval"
              )

          if SUMMARY:
              with open(SUMMARY, "a", encoding="utf-8") as handle:
                  handle.write("## HQ trusted gate\n\n")
                  handle.write("- Result: `PASS`\n")
                  handle.write(f"- Issue: `#{state['issue']}`\n")
                  handle.write(f"- Candidate: `{head_sha}`\n")
                  handle.write(f"- Phase: `{state['phase']}`\n")
                  handle.write(f"- Risk: `{'HIGH' if high_risk else 'NORMAL'}`\n")
                  handle.write(f"- Human approval required: `{approval}`\n")
                  if high_risk_files:
                      handle.write("- High-risk files:\n")
                      for path in high_risk_files:
                          handle.write(f"  - `{path}`\n")
          PY
